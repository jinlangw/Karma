# workflows/long/cockroachdb-long-zone-gc-deep-sweep-adversary
#
# CockroachDB deep zone-config GC TTL sweep with node scale-down adversary during health-check recovery

metadata:
  id: cockroachdb-long-zone-gc-deep-sweep-adversary
  label: CockroachDB deep zone-config GC TTL sweep with node scale-down adversary during health-check recovery
spec:
  prompt_mode: progressive
  adversary:
  - scenario: scale_down_node
    inject_at_stage: stage_10
    lift_at_stage: stage_11
  stages:
  - id: stage_01
    service: cockroachdb
    case: deploy
    retries: 0
  - id: stage_02
    service: cockroachdb
    case: initialize
    retries: 0
  - id: stage_03
    service: cockroachdb
    case: zone-config
    retries: 0
    param_overrides:
      gc_ttl_seconds: 604800
  - id: stage_04
    service: cockroachdb
    case: zone-config
    retries: 0
    param_overrides:
      gc_ttl_seconds: 86400
  - id: stage_05
    service: cockroachdb
    case: zone-config
    retries: 0
    param_overrides:
      gc_ttl_seconds: 43200
  - id: stage_06
    service: cockroachdb
    case: zone-config
    retries: 0
    param_overrides:
      gc_ttl_seconds: 14400
  - id: stage_07
    service: cockroachdb
    case: zone-config
    retries: 0
    param_overrides:
      gc_ttl_seconds: 3600
  - id: stage_08
    service: cockroachdb
    case: cluster-settings
    retries: 0
    param_overrides:
      setting_name: kv.snapshot_rebalance.max_rate
      setting_value: 128MiB
  - id: stage_09
    service: cockroachdb
    case: monitoring-integration
    retries: 0
  - id: stage_10
    service: cockroachdb
    case: health-check-recovery
    retries: 0
  - id: stage_11
    service: cockroachdb
    case: major-upgrade-finalize
    retries: 0
    param_overrides:
      from_version: '24.1.0'
      to_version: 24.1.1
  - id: stage_12
    service: cockroachdb
    case: version-check
    retries: 0
    param_overrides:
      report_key: gc_sweep_version
      to_version: 24.1.1
