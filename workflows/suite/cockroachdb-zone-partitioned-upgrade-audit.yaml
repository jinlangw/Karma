# workflows/error-prone/cockroachdb-zone-partitioned-upgrade-audit
#
# Apply tenant-B zone config, roll upgrade, then audit for compliance

metadata:
  id: cockroachdb-zone-partitioned-upgrade-audit
  label: Apply tenant-B zone config, roll upgrade, then audit for compliance
spec:
  prompt_mode: progressive
  stages:
  - id: stage_01
    service: cockroachdb
    case: zone-config
    retries: 0
    param_overrides:
      target_schema: tenant_b
      protected_schema: tenant_a
      gc_ttl_seconds: 14400
      num_replicas: 3
      range_min_bytes: 134217728
      range_max_bytes: 536870912
  - id: stage_02
    service: cockroachdb
    case: major-upgrade-finalize
    retries: 0
    param_overrides:
      from_version: '24.1.0'
      to_version: 24.1.1
  - id: stage_03
    service: cockroachdb
    case: readonly-audit
    retries: 0
