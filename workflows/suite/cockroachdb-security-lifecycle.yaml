# workflows/suite/cockroachdb-security-lifecycle
#
# CockroachDB security lifecycle: TLS enable then cert rotation

metadata:
  id: cockroachdb-security-lifecycle
  label: 'CockroachDB security lifecycle: TLS enable then cert rotation'
spec:
  prompt_mode: progressive
  # Used only with `run-workflow ... --debug`; regular runs still get isolated
  # Karma-managed namespaces. Here the rotation case's default role must point
  # at the literal namespace used by the preceding CockroachDB cases.
  debug:
    namespace_overrides:
      default: cockroachdb
  stages:
  - id: stage_01
    service: cockroachdb
    case: deploy
    retries: 0
  - id: stage_02
    service: cockroachdb
    case: initialize
    retries: 0
  - id: stage_03
    service: cockroachdb
    case: generate-cert
    retries: 0
  - id: stage_04
    service: cockroachdb
    case: certificate-rotation
    retries: 0
