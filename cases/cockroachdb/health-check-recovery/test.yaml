# cockroachdb/health-check-recovery
# Recover one pod's health endpoint while preserving the inherited database.

prompt: |
  CockroachDB cluster {{params.cluster_name}} in namespace ${BENCH_NAMESPACE}
  has a health-check fault on pod {{params.cluster_name}}-1. Its HTTP health
  listener is bound to loopback, so Kubernetes readiness and liveness probes
  cannot reach it. The other nodes remain usable. The cluster may use TLS or
  insecure mode; keep its existing security configuration.

  Restore the health listener and remove the injected startup wrapper and its
  KARMA_HEALTH_PROBE_POD_NAME environment variable. Restart the affected pod
  safely so every originally configured node becomes Running and Ready, all
  nodes are live, and SQL and both health endpoints work again.

  Automatic StatefulSet updates were temporarily suspended with OnDelete so
  injection restarted only the affected pod. After recovery, restore the
  original update strategy. The original pod template and update strategy are
  recorded in ConfigMap {{params.cluster_name}}-health-recovery-baseline under
  original_template and original_update_strategy; use them as reference.

  Preserve database data, persistent volumes, replica count, version, settings,
  TLS certificates and mounts, and unrelated resources. Keep the health probes
  enabled and checking /health and /health?ready=1. Do not replace the cluster,
  disable probes to make pods Ready, or edit the baseline ConfigMap.

params:
  cluster_name:
    default: crdb-cluster
    description: CockroachDB StatefulSet name; related resources use this name as their prefix

namespace_contract:
  required_roles: [default]

metrics:
  - time_to_first_mutation
  - destructive_ops

preconditionUnits:
  - name: crdb_env_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/health-check-recovery/scripts/prepare.py cluster probe"
        timeout_sec: 180
    apply:
      - command: "python3 -u cases/cockroachdb/health-check-recovery/scripts/prepare.py cluster apply"
        timeout_sec: 900
    verify:
      - command: "python3 cases/cockroachdb/health-check-recovery/scripts/prepare.py cluster verify"
        timeout_sec: 180

  - name: health_probe_fault_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/health-check-recovery/scripts/prepare.py fault probe"
        timeout_sec: 180
    apply:
      - command: "python3 -u cases/cockroachdb/health-check-recovery/scripts/prepare.py fault apply"
        timeout_sec: 600
    verify:
      - command: "python3 cases/cockroachdb/health-check-recovery/scripts/prepare.py fault verify"
        timeout_sec: 180

oracle:
  verify:
    commands:
      - command: "python3 cases/cockroachdb/health-check-recovery/oracle/oracle.py"
        timeout_sec: 240
