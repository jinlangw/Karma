# cockroachdb/generate-cert
#
# A CockroachDB cluster is running in insecure mode with an openssl-toolbox
# pod available. The agent must enable TLS so secure access works and
# insecure access is rejected.

prompt: |
  Generate a fresh CA and certificates, then enable TLS for the running
  CockroachDB cluster {{params.cluster_name}} in namespace ${BENCH_NAMESPACE}.

  The cluster is currently running in insecure mode. An openssl-toolbox pod
  is available for certificate generation. Previous certificate material for
  this cluster has been cleared, including the old CA.

  Generate ca.key, ca.crt, node.key, node.crt, client.root.key, and
  client.root.crt in /tmp/certs in openssl-toolbox. Keep the private CA key
  there for subsequent signing. The node certificate must cover localhost
  and every node's Kubernetes DNS hostname; the client certificate is for root.

  Store the generated TLS material (ca.crt, node.crt, node.key, and the root
  client cert/key) in a Kubernetes Secret named `{{params.cert_secret_name}}` and mount
  that Secret at /cockroach/cockroach-certs on the CockroachDB StatefulSet pods.
  Preserve database data, version, replica count, settings, and unrelated
  resources. Old clients of this same cluster may lose trust when its CA changes.
  Keep the cluster healthy after enabling TLS, including its health probes.

  GOAL:
  1. Insecure access is rejected:
     ```bash
     kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_name}}-0 -- \
       ./cockroach sql --insecure -e "SELECT 1;"
     ```
  2. Secure access succeeds on every node; for example:
     ```bash
     kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_name}}-0 -- \
       ./cockroach sql --certs-dir=/cockroach/cockroach-certs -e "SELECT 1;"
     ```
  3. The cert material lives in a Secret named `{{params.cert_secret_name}}` that the
     StatefulSet mounts (so it is the cert the nodes actually serve).

params:
  cluster_name:
    default: crdb-cluster
    description: CockroachDB StatefulSet name; related resources use this name as their prefix
  cert_secret_name:
    default: crdb-cluster-certs
    description: >-
      Canonical Kubernetes Secret the agent must create and the StatefulSet must
      mount for the cluster TLS material. Fixing the NAME (C2 identity contract)
      lets a downstream cert-rotation stage rotate the very secret the pods
      serve; an agent-chosen name (e.g. crdb-certs) would leave rotation
      targeting a secret nobody mounts.

namespace_contract:
  required_roles: [default]

metrics:
  - time_to_first_mutation

preconditionUnits:
  - name: crdb_env_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/generate-cert/scripts/prepare.py cluster probe"
        timeout_sec: 180
    apply:
      - command: "python3 -u cases/cockroachdb/generate-cert/scripts/prepare.py cluster apply"
        timeout_sec: 900
    verify:
      - command: "python3 cases/cockroachdb/generate-cert/scripts/prepare.py cluster verify"
        timeout_sec: 120

  - name: crdb_toolbox_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/generate-cert/scripts/prepare.py toolbox probe"
        timeout_sec: 120
    apply:
      - command: "python3 -u cases/cockroachdb/generate-cert/scripts/prepare.py toolbox apply"
        timeout_sec: 420
    verify:
      - command: "python3 cases/cockroachdb/generate-cert/scripts/prepare.py toolbox verify"
        timeout_sec: 120

  - name: crdb_tls_material_absent
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/generate-cert/scripts/prepare.py tls probe"
        timeout_sec: 180
    apply:
      - command: "python3 -u cases/cockroachdb/generate-cert/scripts/prepare.py tls apply"
        timeout_sec: 900
    verify:
      - command: "python3 cases/cockroachdb/generate-cert/scripts/prepare.py tls verify"
        timeout_sec: 180

oracle:
  verify:
    commands:
      - command: "python3 cases/cockroachdb/generate-cert/oracle/oracle.py"
        timeout_sec: 240
