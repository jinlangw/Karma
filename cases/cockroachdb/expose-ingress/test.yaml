# cockroachdb/expose-ingress
# Expose the selected CockroachDB console via HTTPS and SQL via TCP forwarding.

prompt: |
  CockroachDB cluster {{params.cluster_name}} is running in namespace
  ${BENCH_NAMESPACE}. The ingress-nginx controller is already installed and
  running in ingress-nginx. The cluster may use TLS or insecure mode.

  Your task:
  - Make the DB Console reachable at https://{{params.ui_host}} (TLS required).
  - Expose SQL traffic via ingress-nginx on TCP port {{params.sql_port}}.

  Notes:
  - Use the {{params.ingress_class_name}} ingress class.
  - SQL uses a TCP protocol (not HTTP).
  - Preserve the database's data, version, replica count, and security mode.
  - Preserve unrelated ingress routes, TCP mappings, controller arguments, and
    controller Service ports. Use the controller's existing TCP ConfigMap if set.
  - Configure the console backend for its existing HTTP or HTTPS protocol.
    Self-signed certificates are accepted for the console's HTTPS endpoint.

  Useful commands:
  ```bash
  kubectl -n ${BENCH_NAMESPACE} get svc,ingress
  kubectl -n ingress-nginx get deploy,svc,cm
  ```

params:
  cluster_name:
    default: crdb-cluster
    description: CockroachDB StatefulSet name; related resources use this name as their prefix
  ui_host:
    default: crdb-ui.example.com
    description: Hostname at which the DB Console must be reachable over HTTPS
  sql_port:
    default: 26257
    description: TCP port on which SQL traffic is exposed via ingress
  ingress_class_name:
    default: nginx
    description: Ingress class used for the exposed routes

namespace_contract:
  required_roles: [default]

metrics:
  - time_to_first_mutation

preconditionUnits:
  # Reuse inherited TLS/insecure state. Only an absent target gets a fresh TLS
  # cluster. Failed recovery does not grant permission to erase data or keys.
  - name: crdb_env_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/expose-ingress/scripts/prepare.py cluster probe"
        timeout_sec: 180
    apply:
      - command: "python3 -u cases/cockroachdb/expose-ingress/scripts/prepare.py cluster apply"
        timeout_sec: 900
    verify:
      - command: "python3 cases/cockroachdb/expose-ingress/scripts/prepare.py cluster verify"
        timeout_sec: 120

  - name: crdb_ingress_controller_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/expose-ingress/scripts/prepare.py controller probe"
        timeout_sec: 60
    apply:
      - command: "python3 -u cases/cockroachdb/expose-ingress/scripts/prepare.py controller apply"
        timeout_sec: 660
    verify:
      - command: "python3 cases/cockroachdb/expose-ingress/scripts/prepare.py controller verify"
        timeout_sec: 60

  - name: crdb_probe_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/expose-ingress/scripts/prepare.py probe probe"
        timeout_sec: 60
    apply:
      - command: "python3 -u cases/cockroachdb/expose-ingress/scripts/prepare.py probe apply"
        timeout_sec: 210
    verify:
      - command: "python3 cases/cockroachdb/expose-ingress/scripts/prepare.py probe verify"
        timeout_sec: 60

  # Reset only this hostname and SQL port. Inspect all ownership conflicts
  # before mutation; keep unrelated routes, certificates, and shared objects.
  - name: crdb_routes_absent
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/expose-ingress/scripts/prepare.py routes probe"
        timeout_sec: 60
    apply:
      - command: "python3 -u cases/cockroachdb/expose-ingress/scripts/prepare.py routes apply"
        timeout_sec: 180
    verify:
      - command: "python3 cases/cockroachdb/expose-ingress/scripts/prepare.py routes verify"
        timeout_sec: 60

oracle:
  verify:
    commands:
      - command: "python3 cases/cockroachdb/expose-ingress/oracle/oracle.py"
        timeout_sec: 240
