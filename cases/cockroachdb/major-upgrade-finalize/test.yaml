# cockroachdb/major-upgrade-finalize
# Prepare a coherent source release with finalization held.

prompt: |
  CockroachDB cluster {{params.cluster_name}} in namespace ${BENCH_NAMESPACE}
  is initialized on release {{params.from_version}}. Major-upgrade finalization
  is held by cluster.preserve_downgrade_option.

  Your task:
  Upgrade all existing nodes to v{{params.to_version}}, then finalize the major
  upgrade by releasing the hold. Confirm the logical database version reaches
  the target release and all selected nodes serve SQL.

  Requirements:
  - Upgrade binaries first, one node at a time; keep the database available.
  - Preserve database contents, StatefulSet and PVC identities, replica count,
    existing TLS or insecure mode, certificate material and other configuration.
  - Use existing resources; do not reset stores or recreate the deployment.
  - Restore the original StatefulSet update strategy after the rolling upgrade.
    The {{params.cluster_name}}-major-upgrade-baseline ConfigMap records it.
  - Leave other workloads and namespace resources untouched. No operators/CRDs/Helm.

  Useful commands:
  ```bash
  kubectl -n ${BENCH_NAMESPACE} get statefulset {{params.cluster_name}} -o yaml
  kubectl -n ${BENCH_NAMESPACE} get pods
  ```
  Inspect the server's existing connection flags before running SQL. Compare the
  actual node versions with SHOW CLUSTER SETTING version: newer binaries alone
  do not prove that a major upgrade is finalized. Wait for completed migrations;
  a transitional logical version is not the final result.

params:
  cluster_name:
    default: crdb-cluster
    description: CockroachDB StatefulSet name; related resources use this name as their prefix
  from_version:
    default: "23.2"
    description: CockroachDB version the cluster starts on before the upgrade
  to_version:
    default: 24.1.0
    description: Target CockroachDB version to upgrade and finalize to

namespace_contract:
  required_roles: [default]

metrics:
  - time_to_first_mutation
  - destructive_ops

preconditionUnits:
  - name: crdb_env_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py environment probe"
        timeout_sec: 120
    apply:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py environment apply"
        timeout_sec: 3600
    verify:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py environment verify"
        timeout_sec: 120

  - name: crdb_source_version_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py source probe"
        timeout_sec: 120
    apply:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py source apply"
        timeout_sec: 3600
    verify:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py source verify"
        timeout_sec: 120

  - name: crdb_upgrade_hold_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py hold probe"
        timeout_sec: 120
    apply:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py hold apply"
        timeout_sec: 180
    verify:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/scripts/prepare.py hold verify"
        timeout_sec: 120

oracle:
  verify:
    commands:
      - command: "python3 cases/cockroachdb/major-upgrade-finalize/oracle/oracle.py"
        timeout_sec: 240
