apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: ${BENCH_NS_ELASTICSEARCH}
spec:
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: ghcr.io/netvark/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: rootPassword
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for i in $(seq 1 60); do
                mc alias set local http://minio.${BENCH_NS_ELASTICSEARCH}.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && break
                sleep 2
              done
              mc mb -p local/es-backups || true
