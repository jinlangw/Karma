apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-pi
  namespace: ${BENCH_NS_SPARK_PI}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-pi-role
  namespace: ${BENCH_NS_SPARK_PI}
rules:
- apiGroups: [""]
  resources: ["services", "configmaps", "persistentvolumeclaims"]
  verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-pi-role-binding
  namespace: ${BENCH_NS_SPARK_PI}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-pi-role
subjects:
- kind: ServiceAccount
  name: spark-pi
  namespace: ${BENCH_NS_SPARK_PI}