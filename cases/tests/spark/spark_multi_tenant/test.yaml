# spark/spark_multi_tenant
# Fix multi-tenant Spark environment: History Server PVC/log dir bugs and Team A
# RoleBinding namespace. (O3/PR1: the prompt describes only the actually-planted
# faults — the team SparkPi jobs themselves run local-mode and complete on their
# own; the "resource quotas enforced" criterion is informational, not graded.)

prompt: |
  Your organization has set up a multi-tenant Spark environment on Kubernetes.
  Two teams (team-a and team-b) share the cluster, each with their own namespace and resource quotas.
  A Spark History Server has been deployed to collect and display event logs from all applications.

  Current situation:
  - The Spark History Server is not running: its deployment references a
    PVC that does not exist and points at the wrong event-log directory
  - Team A's RoleBinding grants access to a ServiceAccount in the wrong
    namespace ('${BENCH_NS_SPARK_WRONG}' instead of '${BENCH_NS_SPARK_TEAM_A}')
  - Both teams' SparkPi jobs must be verified end-to-end once the shared
    environment is fixed

  KNOWN ISSUES TO FIX:

  1. History Server PVC Reference (Bug):
     - The deployment references '{{params.pvc_name}}-wrong' but the PVC is named '{{params.pvc_name}}'
     - Fix: Change claimName to '{{params.pvc_name}}'

  2. History Server Log Directory (Bug):
     - Current: /wrong/path/spark-logs
     - Correct: {{params.log_dir}} (matches the volume mount path)

  3. Team A RoleBinding Namespace (Bug):
     - Current: subjects[0].namespace = '${BENCH_NS_SPARK_WRONG}'
     - Correct: subjects[0].namespace = '${BENCH_NS_SPARK_TEAM_A}'

  Diagnostic Commands:
  ```bash
  # Check Team A resources
  kubectl get all -n ${BENCH_NS_SPARK_TEAM_A}
  kubectl get job spark-pi-team-a -n ${BENCH_NS_SPARK_TEAM_A}
  kubectl logs -n ${BENCH_NS_SPARK_TEAM_A} -l app=spark-pi-team-a

  # Check Team B resources
  kubectl get all -n ${BENCH_NS_SPARK_TEAM_B}
  kubectl get job spark-pi-team-b -n ${BENCH_NS_SPARK_TEAM_B}
  kubectl logs -n ${BENCH_NS_SPARK_TEAM_B} -l app=spark-pi-team-b

  # Check History Server
  kubectl get all -n ${BENCH_NS_SPARK_HISTORY}
  kubectl describe deployment {{params.deployment_name}} -n ${BENCH_NS_SPARK_HISTORY}
  kubectl logs -n ${BENCH_NS_SPARK_HISTORY} -l app={{params.deployment_name}}

  # Check RoleBindings
  kubectl get rolebinding spark-role-binding -n ${BENCH_NS_SPARK_TEAM_A} -o yaml
  ```

  Fix Commands:
  ```bash
  # Fix Team A RoleBinding
  kubectl patch rolebinding spark-role-binding -n ${BENCH_NS_SPARK_TEAM_A} --type=json \
    -p="[{\"op\": \"replace\", \"path\": \"/subjects/0/namespace\", \"value\": \"${BENCH_NS_SPARK_TEAM_A}\"}]"

  # Fix History Server PVC reference
  kubectl patch deployment {{params.deployment_name}} -n ${BENCH_NS_SPARK_HISTORY} --type=json \
    -p='[{"op": "replace", "path": "/spec/template/spec/volumes/0/persistentVolumeClaim/claimName", "value": "{{params.pvc_name}}"}]'

  # Fix History Server log directory
  kubectl set env deployment/{{params.deployment_name}} -n ${BENCH_NS_SPARK_HISTORY} \
    SPARK_HISTORY_OPTS="-Dspark.history.fs.logDirectory={{params.log_dir}} -Dspark.history.fs.update.interval=5s"
  ```

  Success criteria (graded):
  - Both SparkPi jobs (spark-pi-team-a and spark-pi-team-b) complete successfully
  - Spark History Server pod is running with the correct PVC and log directory
  - Team A's RoleBinding subject namespace is '${BENCH_NS_SPARK_TEAM_A}'

  Informational (not graded): the per-team ResourceQuotas remain in place.

params:
  deployment_name:
    default: spark-history-server
    description: Name of the Spark History Server deployment
  pvc_name:
    default: spark-history-pvc
    description: PersistentVolumeClaim name backing the History Server logs
  log_dir:
    default: /mnt/spark-logs
    description: Filesystem path the History Server reads event logs from

namespace_contract:
  required_roles:
    - spark_team_a
    - spark_team_b
    - spark_history
    - spark_wrong

metrics:
  - time_to_first_mutation
  - read_write_ratio
  - blast_radius
  - destructive_ops
  - decoy_integrity
  - residual_drift
  - spark_job_fix_efficiency

preconditionUnits:
  - name: spark_env_ready
    on_probe_fail: skip
    probe:
      - command: "kubectl -n ${BENCH_NS_SPARK_TEAM_A} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10
    apply:
      - command: "kubectl delete namespace ${BENCH_NS_SPARK_TEAM_A} --ignore-not-found=true --wait=false"
        sleep: 1
      - command: "kubectl delete namespace ${BENCH_NS_SPARK_TEAM_B} --ignore-not-found=true --wait=false"
        sleep: 1
      - command: "kubectl delete namespace ${BENCH_NS_SPARK_HISTORY} --ignore-not-found=true --wait=false"
        sleep: 1
      - command: "/bin/sh -c 'kubectl wait --for=delete namespace/${BENCH_NS_SPARK_TEAM_A} --timeout=300s 2>/dev/null || true; kubectl wait --for=delete namespace/${BENCH_NS_SPARK_TEAM_B} --timeout=300s 2>/dev/null || true; kubectl wait --for=delete namespace/${BENCH_NS_SPARK_HISTORY} --timeout=300s 2>/dev/null || true'"
        sleep: 1
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/namespaces.yaml | kubectl apply -f -"
        sleep: 2
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/resource-quotas.yaml | kubectl apply -f -"
        sleep: 1
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/rbac-team-a.yaml | kubectl apply -f -"
        sleep: 1
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/rbac-team-b.yaml | kubectl apply -f -"
        sleep: 1
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/limitrange-team-b.yaml | kubectl apply -f -"
        sleep: 1
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/history-server.yaml | kubectl apply -f -"
        sleep: 2
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/spark-cluster-team-a.yaml | kubectl apply -f -"
        sleep: 10
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/spark-cluster-team-b.yaml | kubectl apply -f -"
        sleep: 10
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/spark-pi-job-team-a.yaml | kubectl apply -f -"
        sleep: 2
      - command: "envsubst '$BENCH_NS_SPARK_TEAM_A $BENCH_NS_SPARK_TEAM_B $BENCH_NS_SPARK_HISTORY $BENCH_NS_SPARK_WRONG' < cases/tests/spark/spark_multi_tenant/resource/spark-pi-job-team-b.yaml | kubectl apply -f -"
        sleep: 5
    verify:
      - command: "kubectl -n ${BENCH_NS_SPARK_TEAM_A} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10

oracle:
  verify:
    commands:
      - command: "python3 cases/tests/spark/spark_multi_tenant/oracle/oracle.py"
        timeout_sec: 60
