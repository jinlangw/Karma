# ray/dashboard_exposure
# Expose Ray dashboard on port 8265 via the ray-head Service

prompt: |
  The Ray dashboard should be reachable from inside the cluster, but the
  ray-head Service only exposes the GCS port.

  Your task: update the ray-head Service to expose the dashboard on port {{params.dashboard_port}}.

  The head serves the dashboard on container port 8265 (the environment
  normally ensures the dashboard process is running on the head — if you find
  it is not, enable it on the ray-head deployment as part of your fix).

  Use this command to test:
  ```bash
  kubectl -n ${BENCH_NS_RAY} exec curl-test -- curl -sS -o /dev/null -w "%{http_code}" \
    http://ray-head:{{params.dashboard_port}}/api/cluster_status
  ```

  Success criteria: the command returns HTTP 200.

params:
  dashboard_port:
    default: 8265
    description: Port on the ray-head Service that exposes the Ray dashboard

namespace_contract:
  required_roles:
    - ray

metrics:
  - time_to_first_mutation

preconditionUnits:
  - name: ray_env_ready
    on_probe_fail: skip
    probe:
      - command: "kubectl -n ${BENCH_NS_RAY} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10
    apply:
      - command: "/bin/sh -c 'kubectl delete namespace ${BENCH_NS_RAY} --ignore-not-found=true --wait=false; kubectl wait --for=delete namespace/${BENCH_NS_RAY} --timeout=300s 2>/dev/null || true'"
        timeout_sec: 360
        sleep: 2
      - command: "kubectl create namespace ${BENCH_NS_RAY}"
        sleep: 0
      - command: "envsubst '$BENCH_NS_RAY' < cases/tests/ray/dashboard_exposure/resource/ray-head-service.yaml | kubectl -n ${BENCH_NS_RAY} apply -f -"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_RAY} apply -f cases/tests/ray/dashboard_exposure/resource/ray-head.yaml"
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_RAY} rollout status deploy/ray-head --timeout=600s"
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_RAY} apply -f cases/tests/ray/dashboard_exposure/resource/ray-worker.yaml"
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_RAY} rollout status deploy/ray-worker --timeout=600s"
        sleep: 2
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_RAY} get pod curl-test >/dev/null 2>&1 || kubectl -n ${BENCH_NS_RAY} apply -f cases/tests/ray/dashboard_exposure/resource/curl-test.yaml'"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_RAY} wait --for=condition=Ready pod/curl-test --timeout=600s"
        timeout_sec: 660
        sleep: 1
    verify:
      - command: "kubectl -n ${BENCH_NS_RAY} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10

  # Additive dashboard-process fixture (C1): the oracle needs the head's
  # dashboard process, but only THIS case's head manifest enables it — every
  # sibling ray case starts the head with --include-dashboard=false, so when
  # this case is composed after another ray stage (ray_env_ready skipped) the
  # oracle's dependency is absent and no Service change can ever return 200.
  # This unit probes the dashboard from inside the head pod (loopback :8265)
  # and, only when absent, best-effort (P8: every mutation `|| true`, verify is
  # a no-op) patches JUST the head deployment's command to the case's own
  # dashboard-enabled variant (P16 — patch, never a manifest re-apply) and
  # waits briefly for the roll. A failure here degrades to a clean oracle
  # FAIL, never a precondition ERROR. The prompt also states the head must
  # serve the dashboard (PR2) so the requirement stays agent-derivable.
  - name: dashboard_process_ready
    on_probe_fail: skip
    probe:
      - command: "kubectl -n ${BENCH_NS_RAY} exec deploy/ray-head -- python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8265/api/cluster_status\", timeout=5)'"
        timeout_sec: 20
    apply:
      - command: "kubectl -n ${BENCH_NS_RAY} patch deploy ray-head --type=json --patch-file cases/tests/ray/dashboard_exposure/resource/enable-dashboard-patch.json || true"
        sleep: 2
      # Bounded, best-effort wait (P13: --timeout paired with timeout_sec).
      - command: "kubectl -n ${BENCH_NS_RAY} rollout status deploy/ray-head --timeout=240s || true"
        timeout_sec: 300
        sleep: 2
    verify:
      - command: "/bin/sh -c 'true'"
        timeout_sec: 5

  # Additive fixture unit (Rule 4): the oracle's HTTP check execs into the
  # curl-test pod. Standalone, ray_env_ready's apply creates it. But in a
  # workflow where this case inherits a live cluster from a prior stage (deploy
  # /scale), ray_env_ready's apply is skipped and no prior case creates
  # curl-test, so the oracle would fail with no test pod. This unit ensures JUST
  # the curl-test pod idempotently, gated by its own probe, WITHOUT touching the
  # cluster/namespace. Standalone it is a harmless no-op (the pod already exists).
  - name: curl_test_ready
    on_probe_fail: skip
    probe:
      - command: "kubectl -n ${BENCH_NS_RAY} get pod curl-test 2>/dev/null | grep -c curl-test"
        timeout_sec: 10
    apply:
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_RAY} get pod curl-test >/dev/null 2>&1 || kubectl -n ${BENCH_NS_RAY} apply -f cases/tests/ray/dashboard_exposure/resource/curl-test.yaml'"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_RAY} wait --for=condition=Ready pod/curl-test --timeout=600s"
        timeout_sec: 660
        sleep: 1
    verify:
      - command: "kubectl -n ${BENCH_NS_RAY} get pod curl-test 2>/dev/null | grep -c curl-test"
        timeout_sec: 10

oracle:
  verify:
    commands:
      - command: "python3 cases/tests/ray/dashboard_exposure/oracle/oracle.py"
        timeout_sec: 180
