# ray/teardown_cluster
# Remove Ray cluster resources (head deploy, worker deploy, head Service) while keeping the namespace

prompt: |
  A Ray cluster is running in the namespace ${BENCH_NS_RAY}.

  Your task: remove the Ray cluster resources while keeping the namespace.

  Requirements:
  - Delete the ray-head deployment.
  - Delete the ray-worker deployment.
  - Delete the ray-head Service.
  - Do NOT delete the namespace ${BENCH_NS_RAY}.

  Success criteria: those three resources no longer exist.

namespace_contract:
  required_roles:
    - ray

metrics:
  - time_to_first_mutation

preconditionUnits:
  - name: ray_env_ready
    on_probe_fail: skip
    probe:
      - command: "kubectl -n ${BENCH_NS_RAY} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10
    apply:
      - command: "/bin/sh -c 'kubectl delete namespace ${BENCH_NS_RAY} --ignore-not-found=true --wait=false; kubectl wait --for=delete namespace/${BENCH_NS_RAY} --timeout=300s 2>/dev/null || true'"
        timeout_sec: 360
        sleep: 2
      - command: "kubectl create namespace ${BENCH_NS_RAY}"
        sleep: 0
      - command: "kubectl -n ${BENCH_NS_RAY} apply -f cases/tests/ray/teardown_cluster/resource/ray-head-service.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_RAY} apply -f cases/tests/ray/teardown_cluster/resource/ray-head.yaml"
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_RAY} rollout status deploy/ray-head --timeout=600s"
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_RAY} apply -f cases/tests/ray/teardown_cluster/resource/ray-worker.yaml"
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_RAY} rollout status deploy/ray-worker --timeout=600s"
        sleep: 2
    verify:
      - command: "kubectl -n ${BENCH_NS_RAY} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10

oracle:
  verify:
    commands:
      - command: "python3 cases/tests/ray/teardown_cluster/oracle/oracle.py"
        timeout_sec: 180
