# rabbitmq/manual_policy_sync
#
# A 3-node RabbitMQ cluster has the /app vhost and a durable classic queue
# (app-queue) but the team's standard ha-all policy is missing. The agent
# must (re)create a policy named ha-all that applies to app-queue. The task
# is version-neutral (C5/PR1): classic-queue MIRRORING only exists on
# pre-4.x brokers, and workflows schedule this case after 4.x upgrades.

prompt: |
  A 3-node RabbitMQ cluster is running in the ${BENCH_NAMESPACE} namespace.
  The /app vhost and a durable classic queue (app-queue) already exist,
  but the team's standard `ha-all` policy is missing from the vhost.

  Ensure a policy NAMED `ha-all` exists on vhost /app with a pattern that
  matches app-queue, so that app-queue reports `ha-all` as its effective
  policy. On brokers older than RabbitMQ 4.x this is the classic
  queue-mirroring policy (e.g. ha-mode: all); on 4.x and newer (where
  classic queue mirroring was removed) use any valid policy definition —
  what is verified is that the ha-all policy exists, its pattern matches
  app-queue, and the queue shows it as its policy. Use only native
  Kubernetes resources or RabbitMQ CLI/API. Do not use any CRD, Operator,
  or third-party controller.

  Requirements:
  - A policy named ha-all exists on vhost /app and its pattern matches
    app-queue.
  - app-queue in /app remains a classic queue and shows policy ha-all.
  - The cluster remains healthy with 3 nodes.

  Cluster context:
    Namespace: ${BENCH_NAMESPACE}
    kubectl -n ${BENCH_NAMESPACE} get pods
    kubectl -n ${BENCH_NAMESPACE} get svc
    kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_prefix}}-0 -- rabbitmqctl list_vhosts
    kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_prefix}}-0 -- rabbitmqctl list_policies -p /app
    kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_prefix}}-0 -- rabbitmqctl list_queues -p /app name type policy

params:
  cluster_prefix:
    default: rabbitmq

namespace_contract:
  required_roles:
    - default

metrics:
  - time_to_first_mutation
  - read_write_ratio
  - blast_radius
  - destructive_ops
  - decoy_integrity
  - residual_drift

preconditionUnits:
  - name: rabbitmq_secrets_ready
    on_probe_fail: skip
    probe:
      - command: "/bin/sh -c 'set -e; kubectl -n ${BENCH_NAMESPACE} get secret {{params.cluster_prefix}}-erlang-cookie >/dev/null; kubectl -n ${BENCH_NAMESPACE} get secret {{params.cluster_prefix}}-admin >/dev/null; kubectl -n ${BENCH_NAMESPACE} get secret {{params.cluster_prefix}}-app >/dev/null'"
        timeout_sec: 20
    apply:
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NAMESPACE} create secret generic {{params.cluster_prefix}}-erlang-cookie --from-literal=cookie=supersecretcookie --dry-run=client -o yaml | kubectl apply -f -'"
        sleep: 1
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NAMESPACE} create secret generic {{params.cluster_prefix}}-admin --from-literal=username=admin --from-literal=password=adminpass --dry-run=client -o yaml | kubectl apply -f -'"
        sleep: 1
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NAMESPACE} create secret generic {{params.cluster_prefix}}-app --from-literal=username=app-user --from-literal=password=apppass --dry-run=client -o yaml | kubectl apply -f -'"
        sleep: 1
    verify:
      - command: "/bin/sh -c 'set -e; kubectl -n ${BENCH_NAMESPACE} get secret {{params.cluster_prefix}}-erlang-cookie >/dev/null; kubectl -n ${BENCH_NAMESPACE} get secret {{params.cluster_prefix}}-admin >/dev/null'"
        timeout_sec: 20

  - name: rbac_ready
    on_probe_fail: skip
    probe:
      - command: "kubectl -n ${BENCH_NAMESPACE} get sa {{params.cluster_prefix}}"
        timeout_sec: 10
    apply:
      - command: "envsubst '$BENCH_NAMESPACE $BENCH_NS_SOURCE $BENCH_NS_TARGET $BENCH_PARAM_CLUSTER_PREFIX $BENCH_PARAM_BLUE_CLUSTER_PREFIX $BENCH_PARAM_GREEN_CLUSTER_PREFIX $BENCH_PARAM_FROM_VERSION' < cases/tests/rabbitmq/manual_policy_sync/resource/rbac.yaml | kubectl -n ${BENCH_NAMESPACE} apply -f -"
        sleep: 1
    verify:
      - command: "kubectl -n ${BENCH_NAMESPACE} get sa {{params.cluster_prefix}}"
        timeout_sec: 10

  - name: infra_ready
    on_probe_fail: skip
    probe:
      - command: "/bin/sh -c 'set -e; kubectl -n ${BENCH_NAMESPACE} get svc {{params.cluster_prefix}} >/dev/null; kubectl -n ${BENCH_NAMESPACE} get svc {{params.cluster_prefix}}-headless >/dev/null'"
        timeout_sec: 20
    apply:
      - command: "envsubst '$BENCH_NAMESPACE $BENCH_NS_SOURCE $BENCH_NS_TARGET $BENCH_PARAM_CLUSTER_PREFIX $BENCH_PARAM_BLUE_CLUSTER_PREFIX $BENCH_PARAM_GREEN_CLUSTER_PREFIX $BENCH_PARAM_FROM_VERSION' < cases/tests/rabbitmq/manual_policy_sync/resource/configmap.yaml | kubectl -n ${BENCH_NAMESPACE} apply -f -"
        sleep: 1
      - command: "envsubst '$BENCH_NAMESPACE $BENCH_NS_SOURCE $BENCH_NS_TARGET $BENCH_PARAM_CLUSTER_PREFIX $BENCH_PARAM_BLUE_CLUSTER_PREFIX $BENCH_PARAM_GREEN_CLUSTER_PREFIX $BENCH_PARAM_FROM_VERSION' < cases/tests/rabbitmq/manual_policy_sync/resource/services.yaml | kubectl -n ${BENCH_NAMESPACE} apply -f -"
        sleep: 1
    verify:
      - command: "/bin/sh -c 'set -e; kubectl -n ${BENCH_NAMESPACE} get svc {{params.cluster_prefix}} >/dev/null; kubectl -n ${BENCH_NAMESPACE} get svc {{params.cluster_prefix}}-headless >/dev/null'"
        timeout_sec: 20

  - name: rabbitmq_cluster_ready
    on_probe_fail: skip
    probe:
      - command: "/bin/sh -c 'set -e; [ \"$(kubectl -n ${BENCH_NAMESPACE} get sts {{params.cluster_prefix}} -o jsonpath=\"{.status.readyReplicas}\")\" = \"3\" ]'"
        timeout_sec: 20
    apply:
      # Composition-tolerance: an inherited StatefulSet from an earlier workflow stage
      # may differ in immutable fields (serviceName/selector/volumeClaimTemplates), which
      # makes `kubectl apply` fail with "Forbidden: updates to statefulset spec ... are
      # forbidden". Orphan-delete the existing STS first so it can be recreated --
      # --cascade=orphan PRESERVES the running pods and the data-* PVCs (and their data),
      # so this is additive and never wipes inherited broker state.
      - command: "kubectl -n ${BENCH_NAMESPACE} delete statefulset {{params.cluster_prefix}} --cascade=orphan --ignore-not-found=true"
        sleep: 1
      - command: "envsubst '$BENCH_NAMESPACE $BENCH_NS_SOURCE $BENCH_NS_TARGET $BENCH_PARAM_CLUSTER_PREFIX $BENCH_PARAM_BLUE_CLUSTER_PREFIX $BENCH_PARAM_GREEN_CLUSTER_PREFIX $BENCH_PARAM_FROM_VERSION' < cases/tests/rabbitmq/manual_policy_sync/resource/statefulset.yaml | kubectl -n ${BENCH_NAMESPACE} apply -f -"
        sleep: 1
      - command: "kubectl -n ${BENCH_NAMESPACE} rollout status statefulset/{{params.cluster_prefix}} --timeout=600s"
        sleep: 1
    verify:
      - command: "/bin/sh -c 'set -e; [ \"$(kubectl -n ${BENCH_NAMESPACE} get sts {{params.cluster_prefix}} -o jsonpath=\"{.status.readyReplicas}\")\" = \"3\" ]'"
        timeout_sec: 20

  - name: setup_job_completed
    on_probe_fail: skip
    probe:
      - command: "python3 cases/tests/rabbitmq/manual_policy_sync/setup_precondition_check.py --namespace ${BENCH_NAMESPACE} --bootstrap-only"
        timeout_sec: 30
    apply:
      - command: "kubectl -n ${BENCH_NAMESPACE} delete job {{params.cluster_prefix}}-setup --ignore-not-found=true"
        sleep: 1
      - command: "envsubst '$BENCH_NAMESPACE $BENCH_NS_SOURCE $BENCH_NS_TARGET $BENCH_PARAM_CLUSTER_PREFIX $BENCH_PARAM_BLUE_CLUSTER_PREFIX $BENCH_PARAM_GREEN_CLUSTER_PREFIX $BENCH_PARAM_FROM_VERSION' < cases/tests/rabbitmq/manual_policy_sync/resource/setup-job.yaml | kubectl -n ${BENCH_NAMESPACE} apply -f -"
        sleep: 1
      - command: "kubectl -n ${BENCH_NAMESPACE} wait --for=condition=complete job/{{params.cluster_prefix}}-setup --timeout=300s"
        sleep: 1
    verify:
      - command: "python3 cases/tests/rabbitmq/manual_policy_sync/setup_precondition_check.py --namespace ${BENCH_NAMESPACE} --bootstrap-only"
        timeout_sec: 30

  - name: curl_test_ready
    on_probe_fail: skip
    probe:
      - command: "kubectl -n ${BENCH_NAMESPACE} wait --for=condition=ready pod -l app=curl-test --timeout=3s"
        timeout_sec: 10
    apply:
      - command: "envsubst '$BENCH_NAMESPACE $BENCH_NS_SOURCE $BENCH_NS_TARGET $BENCH_PARAM_CLUSTER_PREFIX $BENCH_PARAM_BLUE_CLUSTER_PREFIX $BENCH_PARAM_GREEN_CLUSTER_PREFIX $BENCH_PARAM_FROM_VERSION' < cases/tests/rabbitmq/manual_policy_sync/resource/curl-test.yaml | kubectl -n ${BENCH_NAMESPACE} apply -f -"
        sleep: 1
      - command: "kubectl -n ${BENCH_NAMESPACE} wait --for=condition=ready pod -l app=curl-test --timeout=300s"
        sleep: 1
    verify:
      - command: "kubectl -n ${BENCH_NAMESPACE} wait --for=condition=ready pod -l app=curl-test --timeout=3s"
        timeout_sec: 10

  # Problem-shape unit: the unsolved task is "mirroring not yet configured", i.e.
  # the ha-all policy is ABSENT on /app. The setup-job above only creates the
  # vhost/user/queue -- it never removes ha-all -- so standalone a fresh cluster
  # has no ha-all and the probe passes (skip). But when this case re-runs on an
  # INHERITED cluster a prior policy-sync stage already created ha-all; the
  # bootstrap probe (queue exists) passes and the setup-job is skipped, so ha-all
  # persists and the agent would have nothing to do while the oracle still passes
  # trivially. The probe below tests the EXACT oracle-checked drift (ha-all absent);
  # when it is present the apply replants the unsolved baseline by clearing only
  # this case's own ha-all policy. Additive: touches no inherited cluster state
  # beyond the policy the task is about, never restarts a pod.
  - name: policy_sync_baseline_ready
    on_probe_fail: skip
    probe:
      - command: "/bin/sh -c '! kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_prefix}}-0 -- rabbitmqctl -q list_policies -p /app 2>/dev/null | grep -qw ha-all'"
        timeout_sec: 30
    apply:
      # P-converge: clearing a policy is async -- it propagates across the cluster,
      # so a single clear_policy + immediate verify races the propagation. This
      # reconcile also runs on the SECOND scheduling of the case (workflows schedule
      # manual_policy_sync twice) against an inherited ha-all, where the race is most
      # likely. Poll instead of single-shot: re-issue clear_policy until list_policies
      # no longer reports ha-all (bounded), so the "unsynced" baseline is reliably set.
      - command: "/bin/sh -c 'for i in $(seq 1 8); do kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_prefix}}-0 -- rabbitmqctl clear_policy -p /app ha-all >/dev/null 2>&1 || true; sleep 2; kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_prefix}}-0 -- rabbitmqctl -q list_policies -p /app 2>/dev/null | grep -qw ha-all || exit 0; done; exit 0'"
        timeout_sec: 60
    verify:
      - command: "/bin/sh -c '! kubectl -n ${BENCH_NAMESPACE} exec {{params.cluster_prefix}}-0 -- rabbitmqctl -q list_policies -p /app 2>/dev/null | grep -qw ha-all'"
        timeout_sec: 30
        retries: 5
        interval_sec: 3

oracle:
  verify:
    before_commands:
      - command: "envsubst '$BENCH_NAMESPACE $BENCH_NS_SOURCE $BENCH_NS_TARGET $BENCH_PARAM_CLUSTER_PREFIX $BENCH_PARAM_BLUE_CLUSTER_PREFIX $BENCH_PARAM_GREEN_CLUSTER_PREFIX $BENCH_PARAM_FROM_VERSION' < cases/common/rabbitmq/oracle-client.yaml | kubectl -n ${BENCH_NAMESPACE} apply -f -"
        timeout_sec: 30
      - command: "kubectl -n ${BENCH_NAMESPACE} wait --for=condition=ready pod/oracle-client --timeout=60s"
        timeout_sec: 70
    after_commands:
      - command: "kubectl -n ${BENCH_NAMESPACE} delete -f cases/common/rabbitmq/oracle-client.yaml --ignore-not-found=true"
        timeout_sec: 30
    after_failure_mode: warn
    commands:
      - command: "python3 cases/tests/rabbitmq/manual_policy_sync/oracle/oracle.py"
        timeout_sec: 120
