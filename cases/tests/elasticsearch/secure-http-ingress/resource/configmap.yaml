apiVersion: v1
kind: ConfigMap
metadata:
  name: es-config
  namespace: ${BENCH_NS_ELASTICSEARCH}
data:
  elasticsearch.yml: |
    cluster.name: es-cluster
    node.name: ${POD_NAME}
    node.roles: [ master, data, ingest ]
    network.host: 0.0.0.0
    discovery.seed_hosts:
      - es-cluster-0.es-cluster.${BENCH_NS_ELASTICSEARCH}.svc.cluster.local
      - es-cluster-1.es-cluster.${BENCH_NS_ELASTICSEARCH}.svc.cluster.local
      - es-cluster-2.es-cluster.${BENCH_NS_ELASTICSEARCH}.svc.cluster.local
    cluster.initial_master_nodes:
      - es-cluster-0
      - es-cluster-1
      - es-cluster-2
    node.store.allow_mmap: false
    xpack.security.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false
