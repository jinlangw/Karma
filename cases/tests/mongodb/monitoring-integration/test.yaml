# mongodb/monitoring-integration
# Enable end-to-end monitoring so Prometheus scrapes MongoDB metrics

params:
  cluster_prefix:
    default: mongo-rs
    description: StatefulSet name of the replica set members.
  replica_set_name:
    default: rs0
    description: MongoDB replica set _id used when initiating the set.
  curl_pod_name:
    default: curl-test
    description: Helper pod used to query metrics endpoints.
  exporter_deployment_name:
    default: mongodb-exporter
    description: Name of the MongoDB metrics exporter to deploy.
  prometheus_configmap_name:
    default: prometheus-config
    description: ConfigMap holding the Prometheus scrape configuration.
  metrics_query:
    default: mongodb_up
    description: Prometheus metric that must report MongoDB is up.

prompt: |
  A 3-member MongoDB replica set is running in the ${BENCH_NS_MONGODB} namespace.
  Prometheus is running in the ${BENCH_NS_MONITORING} namespace and currently scrapes only itself.
  A {{params.curl_pod_name}} pod is available in the ${BENCH_NS_MONGODB} namespace.

  Task:
  - Enable end-to-end monitoring so Prometheus scrapes MongoDB metrics.
  - You may deploy {{params.exporter_deployment_name}} (sidecar or standalone) and configure Prometheus to scrape it.
  - Prometheus must report {{params.metrics_query}} == 1.

  Notes:
  - Prometheus reads its config from the {{params.prometheus_configmap_name}} ConfigMap in monitoring.
  - Prometheus supports reload via /-/reload or by restarting the pod.
  - Do not use operators or CRDs.

namespace_contract:
  required_roles:
    - mongodb
    - monitoring

metrics:
  - time_to_first_mutation

preconditionUnits:
  - name: mongo_env_ready
    on_probe_fail: skip
    probe:
      # AUTHORITATIVE skip-if-running probe (P32): succeed when the canonical
      # StatefulSet exists OR any pod is Running, so the destructive namespace
      # rebuild below is skipped on an inherited cluster even if its pods are
      # momentarily not Running (mid-restart from a prior stage) -- the
      # StatefulSet persists across that window. The bare `grep -c Running`
      # could miss such a cluster and clobber inherited state.
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} get statefulset {{params.cluster_prefix}} >/dev/null 2>&1 || kubectl -n ${BENCH_NS_MONGODB} get pods 2>/dev/null | grep -q Running'"
        timeout_sec: 10
    apply:
      - command: "/bin/sh -c 'kubectl delete namespace ${BENCH_NS_MONGODB} --ignore-not-found=true; kubectl wait --for=delete namespace/${BENCH_NS_MONGODB} --timeout=120s || true; kubectl delete namespace ${BENCH_NS_MONITORING} --ignore-not-found=true; kubectl wait --for=delete namespace/${BENCH_NS_MONITORING} --timeout=120s || true'"
        sleep: 2
      - command: "kubectl create namespace ${BENCH_NS_MONITORING}"
        sleep: 1
      - command: "kubectl create namespace ${BENCH_NS_MONGODB}"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/monitoring-integration/resource/services.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/monitoring-integration/resource/statefulset.yaml"
        sleep: 3
      - command: |
          /bin/sh -c 'for i in $(seq 1 60); do ready=$(kubectl -n ${BENCH_NS_MONGODB} get sts {{params.cluster_prefix}} -o jsonpath='\''{.status.readyReplicas}'\'' 2>/dev/null); if [ "${ready:-0}" -ge 3 ]; then exit 0; fi; sleep 5; done; exit 1'
        sleep: 2
      # Pod-Ready != mongod accepting TCP (§1.10): ping-until-ok before rs.initiate.
      - command: |
          /bin/sh -c 'for i in $(seq 1 30); do kubectl -n ${BENCH_NS_MONGODB} exec mongo-rs-0 -- mongosh --quiet --eval '\''db.runCommand({ping:1}).ok'\'' 2>/dev/null | grep -q 1 && exit 0; sleep 3; done; exit 1'
        sleep: 2
      - command: |
          /bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} exec mongo-rs-0 -- mongosh --quiet --eval "rs.initiate({_id:\"{{params.replica_set_name}}\",members:[{_id:0,host:\"mongo-rs-0.mongo.${BENCH_NS_MONGODB}.svc.cluster.local:27017\"},{_id:1,host:\"mongo-rs-1.mongo.${BENCH_NS_MONGODB}.svc.cluster.local:27017\"},{_id:2,host:\"mongo-rs-2.mongo.${BENCH_NS_MONGODB}.svc.cluster.local:27017\"}]})"'
        sleep: 5
      - command: |
          /bin/sh -c 'for i in $(seq 1 20); do kubectl -n ${BENCH_NS_MONGODB} exec mongo-rs-0 -- mongosh --quiet --eval '\''db.hello().isWritablePrimary'\'' | grep true && exit 0; sleep 3; done; exit 1'
        sleep: 2
      # P26: prometheus-rbac.yaml carries a cluster-scoped ClusterRole +
      # ClusterRoleBinding (both named `prometheus`); a CRB roleRef is immutable,
      # so on a reused cluster where a sibling/prior run already owns a `prometheus`
      # CRB a bare apply fails and aborts the whole precondition. Make it
      # best-effort (`|| true`); the unit's `prometheus pod Ready` wait is the real
      # gate. Standalone (fresh cluster) the apply succeeds, so `|| true` is a no-op.
      - command: "/bin/sh -c 'envsubst \"\\$BENCH_NS_MONITORING\" < cases/tests/mongodb/monitoring-integration/resource/prometheus-rbac.yaml | kubectl -n ${BENCH_NS_MONITORING} apply -f - || true'"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONITORING} apply -f cases/tests/mongodb/monitoring-integration/resource/prometheus-config.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONITORING} apply -f cases/tests/mongodb/monitoring-integration/resource/prometheus-deployment.yaml"
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_MONITORING} apply -f cases/tests/mongodb/monitoring-integration/resource/prometheus-service.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONITORING} wait --for=condition=ready pod -l app=prometheus --timeout=300s"
        sleep: 2
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} get pod curl-test >/dev/null 2>&1 || kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/monitoring-integration/resource/curl-test.yaml'"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} wait --for=condition=ready pod {{params.curl_pod_name}} --timeout=300s"
        sleep: 1
    verify:
      - command: "kubectl -n ${BENCH_NS_MONGODB} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10

  # Self-contained Prometheus stack (composition safety): the prompt states Prometheus
  # is ALREADY running in the ${BENCH_NS_MONITORING} namespace and "currently scrapes only itself";
  # the agent only reconfigures it to scrape mongodb. mongo_env_ready seeds the
  # ${BENCH_NS_MONITORING} namespace + Prometheus rbac/config/deployment/service on its destructive
  # build path, which is SKIPPED on an inherited cluster, so the oracle's
  # prometheus_request(/-/ready) fails with no Prometheus to reach. Re-establish the
  # Prometheus stack (and the curl helper) additively when its pod is absent. Never
  # deletes any namespace. Standalone it already exists so the probe matches and this
  # unit skips (byte-identical standalone behaviour).
  - name: prometheus_stack_fixture
    on_probe_fail: skip
    probe:
      - command: "kubectl -n ${BENCH_NS_MONITORING} get pod -l app=prometheus 2>/dev/null | grep -c Running"
        timeout_sec: 10
    apply:
      - command: "/bin/sh -c 'kubectl create namespace ${BENCH_NS_MONITORING} --dry-run=client -o yaml | kubectl apply -f -'"
        sleep: 1
      # P26: prometheus-rbac.yaml carries a cluster-scoped ClusterRole +
      # ClusterRoleBinding (both named `prometheus`); a CRB roleRef is immutable,
      # so on a reused cluster where a sibling/prior run already owns a `prometheus`
      # CRB a bare apply fails and aborts the whole precondition. Make it
      # best-effort (`|| true`); the unit's `prometheus pod Ready` wait is the real
      # gate. Standalone (fresh cluster) the apply succeeds, so `|| true` is a no-op.
      - command: "/bin/sh -c 'envsubst \"\\$BENCH_NS_MONITORING\" < cases/tests/mongodb/monitoring-integration/resource/prometheus-rbac.yaml | kubectl -n ${BENCH_NS_MONITORING} apply -f - || true'"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONITORING} apply -f cases/tests/mongodb/monitoring-integration/resource/prometheus-config.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONITORING} apply -f cases/tests/mongodb/monitoring-integration/resource/prometheus-deployment.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONITORING} apply -f cases/tests/mongodb/monitoring-integration/resource/prometheus-service.yaml"
        sleep: 2
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} get pod {{params.curl_pod_name}} >/dev/null 2>&1 || kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/monitoring-integration/resource/curl-test.yaml'"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONITORING} wait --for=condition=ready pod -l app=prometheus --timeout=300s"
        sleep: 1
    verify:
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONITORING} get pod -l app=prometheus >/dev/null 2>&1; true'"
        timeout_sec: 10

  # Fault replant (C8/P3): the unsolved problem is "Prometheus scrapes only
  # itself". The stack fixture above probes its own deliverable (the Prometheus
  # pod), which is a PROXY for this case's fault: composed after a prior
  # monitoring-integration stage the pod is Running with a config that already
  # scrapes mongodb, the fixture skips, and the oracle passes with zero agent
  # action. This unit probes the FAULT itself -- the scrape config must not
  # reference a mongodb target -- and, on an inherited solved config, re-plants
  # the self-scrape-only baseline + reloads Prometheus. Data-only: no
  # namespace or pod deletion (the deployment sets --web.enable-lifecycle, so
  # POST /-/reload applies the ConfigMap once the kubelet syncs the volume).
  - name: prometheus_selfscrape_replant
    on_probe_fail: skip
    probe:
      # True (skip) when the fault is ALREADY present: the scrape config has no
      # mongodb target (also true on a fresh build, where the stack fixture /
      # env build just planted the self-scrape baseline).
      - command: |
          /bin/sh -c '! kubectl -n ${BENCH_NS_MONITORING} get configmap {{params.prometheus_configmap_name}} -o jsonpath="{.data.prometheus\.yml}" 2>/dev/null | grep -qi mongodb'
        timeout_sec: 15
    apply:
      - command: "kubectl -n ${BENCH_NS_MONITORING} apply -f cases/tests/mongodb/monitoring-integration/resource/prometheus-config.yaml"
        sleep: 2
      # Reload until the RUNNING Prometheus drops the mongodb scrape job; the
      # kubelet syncs the ConfigMap volume within ~1 min, so poll reload + the
      # live /api/v1/status/config. Best-effort (P8): a slow sync degrades to
      # the (correctly unsolved) baseline, never a precondition ERROR.
      - command: |
          /bin/sh -c '
          for i in $(seq 1 20); do
            kubectl -n ${BENCH_NS_MONGODB} exec {{params.curl_pod_name}} -- curl -s -X POST http://prometheus.${BENCH_NS_MONITORING}.svc.cluster.local:9090/-/reload >/dev/null 2>&1 || true
            cfg=$(kubectl -n ${BENCH_NS_MONGODB} exec {{params.curl_pod_name}} -- curl -s --max-time 10 http://prometheus.${BENCH_NS_MONITORING}.svc.cluster.local:9090/api/v1/status/config 2>/dev/null)
            echo "$cfg" | grep -qi mongodb || exit 0
            sleep 5
          done
          exit 0
          '
        timeout_sec: 160
    verify:
      # The stored config is authoritative and deterministic: it must no longer
      # reference a mongodb scrape target.
      - command: |
          /bin/sh -c '! kubectl -n ${BENCH_NS_MONITORING} get configmap {{params.prometheus_configmap_name}} -o jsonpath="{.data.prometheus\.yml}" 2>/dev/null | grep -qi mongodb'
        timeout_sec: 15

oracle:
  verify:
    commands:
      - command: "python3 cases/tests/mongodb/monitoring-integration/oracle/oracle.py"
        timeout_sec: 60
