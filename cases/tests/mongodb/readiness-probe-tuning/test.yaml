# mongodb/readiness-probe-tuning
# Tune readiness and liveness probes so a MongoDB replica set becomes stable

params:
  cluster_prefix:
    default: mongodb-replica
    description: App label / StatefulSet name of the replica set members.
  replica_set_name:
    default: mongodb-replica
    description: MongoDB replica set _id used when initiating the set.
  admin_username:
    default: admin-user
    description: Username of the MongoDB admin user.
  health_username:
    default: health-user
    description: Username of the health-check monitoring user.
  faulty_readiness_initial_delay:
    default: 5
    description: Faulty readiness probe initialDelaySeconds applied as the bug.
  faulty_readiness_timeout:
    default: 1
    description: Faulty readiness probe timeoutSeconds applied as the bug.
  faulty_readiness_failure_threshold:
    default: 2
    description: Faulty readiness probe failureThreshold applied as the bug.
  faulty_liveness_initial_delay:
    default: 15
    description: Faulty liveness probe initialDelaySeconds applied as the bug.
  faulty_liveness_timeout:
    default: 1
    description: Faulty liveness probe timeoutSeconds applied as the bug.
  faulty_liveness_failure_threshold:
    default: 2
    description: Faulty liveness probe failureThreshold applied as the bug.

prompt: |
  A 3-member MongoDB replica set is running in the ${BENCH_NS_MONGODB} namespace with auth enabled.
  Pods are repeatedly failing readiness/liveness checks even though MongoDB is healthy.

  Task:
  - Tune the probes so the replica set becomes stable.
  - All pods must become Ready.
  - Replica set should have 1 PRIMARY and 2 SECONDARY members.

  Notes:
  - Do not disable authentication.
  - No operators or CRDs.

namespace_contract:
  required_roles:
    - mongodb

metrics:
  - time_to_first_mutation

preconditionUnits:
  - name: mongo_env_ready
    on_probe_fail: skip
    probe:
      # Non-destructive skip-if-running probe: if a MongoDB cluster is already
      # present (e.g. inherited from a prior workflow stage), SKIP the apply so
      # accumulated state is preserved. The apply only runs on an empty
      # namespace. The case's health-check fixtures (the health-user-password
      # secret + the health-user) are ensured ADDITIVELY by a separate unit
      # below, never by wiping/redeploying the namespace.
      # AUTHORITATIVE skip-if-running probe (P32): succeed when the canonical
      # StatefulSet exists OR any pod is Running, so the destructive namespace
      # rebuild below is skipped on an inherited cluster even if its pods are
      # momentarily not Running (mid-restart from a prior stage) -- the
      # StatefulSet persists across that window. The bare `grep -c Running`
      # could miss such a cluster and clobber inherited state.
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} get statefulset {{params.cluster_prefix}} >/dev/null 2>&1 || kubectl -n ${BENCH_NS_MONGODB} get pods 2>/dev/null | grep -q Running'"
        timeout_sec: 10
    apply:
      - command: "/bin/sh -c 'kubectl delete namespace ${BENCH_NS_MONGODB} --ignore-not-found=true; kubectl wait --for=delete namespace/${BENCH_NS_MONGODB} --timeout=120s || true'"
        sleep: 2
      - command: "kubectl create namespace ${BENCH_NS_MONGODB}"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/readiness-probe-tuning/resource/secrets.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/readiness-probe-tuning/resource/probe-script.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/readiness-probe-tuning/resource/services.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/readiness-probe-tuning/resource/statefulset.yaml"
        sleep: 5
      - command: |
          /bin/sh -c 'for i in $(seq 1 120); do phase=$(kubectl -n ${BENCH_NS_MONGODB} get pod mongodb-replica-0 -o jsonpath='\''{.status.phase}'\'' 2>/dev/null); if [ "${phase}" = "Running" ]; then exit 0; fi; sleep 5; done; exit 1'
        timeout_sec: 600
        sleep: 2
      - command: |
          /bin/sh -c 'for i in $(seq 1 120); do phase=$(kubectl -n ${BENCH_NS_MONGODB} get pod mongodb-replica-2 -o jsonpath='\''{.status.phase}'\'' 2>/dev/null); if [ "${phase}" = "Running" ]; then exit 0; fi; sleep 5; done; exit 1'
        timeout_sec: 600
        sleep: 2
      - command: |
          for i in 0 1 2; do
            for t in $(seq 1 60); do
              if kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-$i -- \
                   mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then
                break
              fi
              sleep 5
            done
          done
        timeout_sec: 400
        sleep: 2
      - command: |
          /bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet --eval "rs.initiate({_id:\"{{params.replica_set_name}}\",members:[{_id:0,host:\"mongodb-replica-0.mongodb-replica-svc.${BENCH_NS_MONGODB}.svc.cluster.local:27017\"},{_id:1,host:\"mongodb-replica-1.mongodb-replica-svc.${BENCH_NS_MONGODB}.svc.cluster.local:27017\"},{_id:2,host:\"mongodb-replica-2.mongodb-replica-svc.${BENCH_NS_MONGODB}.svc.cluster.local:27017\"}]})"'
        sleep: 5
      - command: |
          /bin/sh -c 'for i in $(seq 1 20); do kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet --eval '\''db.hello().isWritablePrimary'\'' | grep true && exit 0; sleep 3; done; exit 1'
        sleep: 2
      - command: |
          /bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet --eval '\''db.getSiblingDB("admin").createUser({user:"{{params.admin_username}}",pwd:"admin123password",roles:[{role:"clusterAdmin",db:"admin"},{role:"userAdminAnyDatabase",db:"admin"},{role:"readWriteAnyDatabase",db:"admin"}]})'\'''
        sleep: 2
      - command: |
          /bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet "mongodb://{{params.admin_username}}:admin123password@localhost:27017/admin" --eval '\''db.getSiblingDB("admin").createUser({user:"{{params.health_username}}",pwd:"healthpass123",roles:[{role:"clusterMonitor",db:"admin"}]})'\'''
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_MONGODB} wait --for=condition=ready pod -l app={{params.cluster_prefix}} --timeout=300s"
        sleep: 2
      - command: |
          /bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} patch sts {{params.cluster_prefix}} --type=json -p='\''[{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/initialDelaySeconds","value":{{params.faulty_readiness_initial_delay}}},{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/timeoutSeconds","value":{{params.faulty_readiness_timeout}}},{"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe/failureThreshold","value":{{params.faulty_readiness_failure_threshold}}},{"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/initialDelaySeconds","value":{{params.faulty_liveness_initial_delay}}},{"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/timeoutSeconds","value":{{params.faulty_liveness_timeout}}},{"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe/failureThreshold","value":{{params.faulty_liveness_failure_threshold}}}]'\'''
        sleep: 2
      - command: "kubectl -n ${BENCH_NS_MONGODB} delete pod -l app={{params.cluster_prefix}}"
        sleep: 2
    verify:
      - command: "kubectl -n ${BENCH_NS_MONGODB} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10

  - name: admin_user_fixture
    # Composition self-sufficiency: this case authenticates as the `admin-user`
    # created at deploy. On an inherited cluster a no-auth/other predecessor may
    # not have created it, and a live user's password is unrecoverable -> the
    # oracle's (and the user fixtures') admin auth fails through no agent fault.
    # Bring our own additively: if admin-user already authenticates, skip; else
    # ensure the secret and create the user. No restart, no data touched,
    # idempotent -> never regresses a cluster where admin already works.
    on_probe_fail: skip
    probe:
      - command: |
          /bin/sh -c '
          t=""; for cca in /etc/tls/ca.crt /etc/mongo-ca/ca.crt; do kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- ls $cca >/dev/null 2>&1 && { t="--tls --tlsAllowInvalidHostnames --tlsAllowInvalidCertificates --tlsCAFile $cca"; break; }; done
          pw=$(kubectl -n ${BENCH_NS_MONGODB} get secret admin-user-password -o jsonpath="{.data.password}" 2>/dev/null | base64 -d 2>/dev/null)
          [ -n "$pw" ] || exit 1
          kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet $t "mongodb://{{params.admin_username}}:$pw@localhost:27017/admin" --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1
          '
        timeout_sec: 30
    apply:
      # Ensure the admin secret (idempotent: create only if missing).
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} get secret admin-user-password >/dev/null 2>&1 || kubectl -n ${BENCH_NS_MONGODB} create secret generic admin-user-password --from-literal=password=admin123password'"
        sleep: 1
      # Ensure the admin-user MongoDB user. On a no-auth inherited cluster this
      # runs unauthenticated and succeeds; where it already exists it errors and
      # the `|| true` keeps it a no-op. Never drops or alters existing users/data.
      - command: |
          /bin/sh -c '
          t=""; for cca in /etc/tls/ca.crt /etc/mongo-ca/ca.crt; do kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- ls $cca >/dev/null 2>&1 && { t="--tls --tlsAllowInvalidHostnames --tlsAllowInvalidCertificates --tlsCAFile $cca"; break; }; done
          P=""; for _pi in $(seq 1 30); do P=$(kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet $t --eval "rs.hello().primary" 2>/dev/null | cut -d. -f1); [ -n "$P" ] && break; sleep 2; done; P=${P:-mongodb-replica-0}
          kubectl -n ${BENCH_NS_MONGODB} exec "$P" -- mongosh --quiet $t --eval "db.getSiblingDB(\"admin\").createUser({user:\"{{params.admin_username}}\",pwd:\"admin123password\",roles:[{role:\"root\",db:\"admin\"}]})" 2>/dev/null || true
          '
        sleep: 2
    verify:
      # P38: read the write back -- authenticate AS the admin user just created and
      # ping (bounded poll to tolerate election/replication lag), not merely assert
      # the companion secret exists.
      - command: |
          /bin/sh -c '
          t=""; for cca in /etc/tls/ca.crt /etc/mongo-ca/ca.crt; do kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- ls $cca >/dev/null 2>&1 && { t="--tls --tlsAllowInvalidHostnames --tlsAllowInvalidCertificates --tlsCAFile $cca"; break; }; done
          pw=$(kubectl -n ${BENCH_NS_MONGODB} get secret admin-user-password -o jsonpath="{.data.password}" 2>/dev/null | base64 -d 2>/dev/null); pw=${pw:-admin123password}
          for _vi in $(seq 1 20); do
            kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet $t "mongodb://{{params.admin_username}}:$pw@localhost:27017/admin?directConnection=true" --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1 && exit 0
            sleep 3
          done
          exit 1
          '
        timeout_sec: 90

  # ADDITIVE fixture-ensure unit. The oracle reads the health-user-password
  # secret and authenticates the health-user MongoDB user; the main unit's apply
  # creates both, but in a workflow that apply is skipped (a cluster is already
  # present). This unit ensures JUST those two fixtures idempotently WITHOUT
  # touching the namespace/cluster, so an inherited cluster keeps all prior
  # state. Standalone it is a no-op (the main apply already created them, so the
  # probe passes and this apply is skipped).
  - name: health_user_fixture
    on_probe_fail: skip
    probe:
      # Skip the ensure only when BOTH the secret and the health-user already
      # exist; otherwise fall through to the additive apply.
      - command: |
          /bin/sh -c '
          kubectl -n ${BENCH_NS_MONGODB} get secret health-user-password >/dev/null 2>&1 || exit 1
          kubectl -n ${BENCH_NS_MONGODB} get pod {{params.cluster_prefix}}-0 >/dev/null 2>&1 || exit 1
          admin_pw=$(kubectl -n ${BENCH_NS_MONGODB} get secret admin-user-password -o jsonpath="{.data.password}" 2>/dev/null | base64 -d 2>/dev/null)
          [ -n "$admin_pw" ] || exit 1
          t=""; for cca in /etc/tls/ca.crt /etc/mongo-ca/ca.crt; do kubectl -n ${BENCH_NS_MONGODB} exec {{params.cluster_prefix}}-0 -- ls $cca >/dev/null 2>&1 && { t="--tls --tlsAllowInvalidHostnames --tlsAllowInvalidCertificates --tlsCAFile $cca"; break; }; done
          kubectl -n ${BENCH_NS_MONGODB} exec {{params.cluster_prefix}}-0 -- mongosh --quiet $t "mongodb://{{params.admin_username}}:${admin_pw}@localhost:27017/admin" --eval "db.getUser(\"{{params.health_username}}\") ? quit(0) : quit(1)" >/dev/null 2>&1
          '
        timeout_sec: 30
    apply:
      # Ensure the secret (idempotent: create only if missing).
      - command: |
          /bin/sh -c '
          kubectl -n ${BENCH_NS_MONGODB} get secret health-user-password >/dev/null 2>&1 || \
            kubectl -n ${BENCH_NS_MONGODB} create secret generic health-user-password --from-literal=password=healthpass123
          '
        sleep: 1
      # Ensure the health-user MongoDB user (idempotent: create only if absent),
      # using the live admin credentials so a prior admin-password rotation is
      # respected. Never drops or alters existing users/data.
      - command: |
          /bin/sh -c '
          admin_pw=$(kubectl -n ${BENCH_NS_MONGODB} get secret admin-user-password -o jsonpath="{.data.password}" 2>/dev/null | base64 -d 2>/dev/null)
          [ -n "$admin_pw" ] || { echo "admin-user-password secret unavailable; cannot ensure health-user"; exit 0; }
          P=""; for _pi in $(seq 1 30); do P=$(kubectl -n ${BENCH_NS_MONGODB} exec {{params.cluster_prefix}}-0 -- mongosh --quiet "mongodb://{{params.admin_username}}:${admin_pw}@localhost:27017/admin?directConnection=true" --eval "rs.hello().primary" 2>/dev/null | cut -d. -f1); [ -n "$P" ] && break; sleep 2; done; P=${P:-{{params.cluster_prefix}}-0}
          kubectl -n ${BENCH_NS_MONGODB} exec "$P" -- mongosh --quiet "mongodb://{{params.admin_username}}:${admin_pw}@localhost:27017/admin" --eval "
            if (!db.getUser(\"{{params.health_username}}\")) {
              db.getSiblingDB(\"admin\").createUser({user:\"{{params.health_username}}\",pwd:\"healthpass123\",roles:[{role:\"clusterMonitor\",db:\"admin\"}]});
            }" >/dev/null 2>&1 || true
          '
        sleep: 2
    verify:
      # P38: read the write back -- authenticate AS the health user just created and
      # ping (bounded poll for election/replication lag), not merely assert the
      # companion secret exists.
      - command: |
          /bin/sh -c '
          for _vi in $(seq 1 20); do
            kubectl -n ${BENCH_NS_MONGODB} exec {{params.cluster_prefix}}-0 -- mongosh --quiet "mongodb://{{params.health_username}}:healthpass123@localhost:27017/admin?directConnection=true" --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1 && exit 0
            sleep 3
          done
          exit 1
          '
        timeout_sec: 90

  # Fault replant (C8, modeled on health-check-recovery's
  # health_probe_fault_ready): the unsolved problem is "probes too aggressive
  # to stay Ready". Standalone, mongo_env_ready patches the faulty values in at
  # build time; composed, that destructive build is skipped on an inherited
  # cluster and a prior identical stage may already have healed the probes --
  # without replanting, the oracle would pass with zero agent action (O1).
  # Probe the faulty values' ABSENCE and patch them back in + bounce the pods
  # (a template patch alone never takes effect -- ADV7's rollout discipline).
  # The replant uses op:add (NOT op:replace) on every probe field: an inherited
  # STS whose livenessProbe never set timeoutSeconds/failureThreshold leaves those
  # paths absent, and op:replace on an absent path aborts the WHOLE atomic patch ->
  # nothing plants and the oracle grades an unfaulted probe ("timeoutSeconds None")
  # (P28). op:add creates-or-replaces, working whether or not the field pre-exists.
  # Additive (no namespace/STS delete, PVC data preserved) and best-effort
  # (P8): a patch that cannot apply degrades to an oracle fail of the
  # fault-shape, never a precondition ERROR. Declared last so the admin/health
  # user fixtures above exec into still-healthy pods (P37).
  - name: probe_fault_replant
    on_probe_fail: skip
    probe:
      # True (skip) when the fault is ALREADY present: the readiness probe
      # carries the faulty timeoutSeconds/failureThreshold pair -- the two
      # fields the fault genuinely breaks and the oracle grades.
      - command: |
          /bin/sh -c '
          rt=$(kubectl -n ${BENCH_NS_MONGODB} get sts {{params.cluster_prefix}} -o jsonpath="{.spec.template.spec.containers[0].readinessProbe.timeoutSeconds}" 2>/dev/null)
          rf=$(kubectl -n ${BENCH_NS_MONGODB} get sts {{params.cluster_prefix}} -o jsonpath="{.spec.template.spec.containers[0].readinessProbe.failureThreshold}" 2>/dev/null)
          [ "$rt" = "{{params.faulty_readiness_timeout}}" ] && [ "$rf" = "{{params.faulty_readiness_failure_threshold}}" ]
          '
        timeout_sec: 15
    apply:
      - command: |
          /bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} patch sts {{params.cluster_prefix}} --type=json -p='\''[{"op":"add","path":"/spec/template/spec/containers/0/readinessProbe/initialDelaySeconds","value":{{params.faulty_readiness_initial_delay}}},{"op":"add","path":"/spec/template/spec/containers/0/readinessProbe/timeoutSeconds","value":{{params.faulty_readiness_timeout}}},{"op":"add","path":"/spec/template/spec/containers/0/readinessProbe/failureThreshold","value":{{params.faulty_readiness_failure_threshold}}},{"op":"add","path":"/spec/template/spec/containers/0/livenessProbe/initialDelaySeconds","value":{{params.faulty_liveness_initial_delay}}},{"op":"add","path":"/spec/template/spec/containers/0/livenessProbe/timeoutSeconds","value":{{params.faulty_liveness_timeout}}},{"op":"add","path":"/spec/template/spec/containers/0/livenessProbe/failureThreshold","value":{{params.faulty_liveness_failure_threshold}}}]'\'' || true'
        sleep: 2
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} delete pod -l app={{params.cluster_prefix}} --ignore-not-found=true || true'"
        sleep: 2
    verify:
      - command: "/bin/sh -c 'true'"
        timeout_sec: 5

oracle:
  verify:
    commands:
      - command: "python3 cases/tests/mongodb/readiness-probe-tuning/oracle/oracle.py"
        timeout_sec: 300
