# mongodb/custom-roles
# MongoDB custom-roles task

params:
  cluster_prefix:
    default: mongodb-replica
    description: StatefulSet name of the replica set members.
  replica_set_name:
    default: mongodb-replica
    description: MongoDB replica set _id used when initiating the set.
  admin_secret_name:
    default: admin-user-password
    description: Kubernetes Secret holding the admin user's password.
  reporting_secret_name:
    default: reporting-user-password
    description: Kubernetes Secret holding the reporting user's password.
  admin_username:
    default: admin-user
    description: Username of the MongoDB admin user.
  reporting_username:
    default: reporting-user
    description: Username of the reporting user.
  app_database:
    default: appdb
    description: Application database holding the reporting collections.
  reports_collection:
    default: reports
    description: Collection backing the reporting dashboards.
  raw_collection:
    default: raw
    description: Collection with ingestion data that must not be exposed.
  bad_role_name:
    default: rawRead
    description: Overly-permissive role initially granted to the reporting user.

prompt: |
  A 3-member MongoDB replica set is running in the ${BENCH_NS_MONGODB} namespace.
  Authentication is enabled. Passwords are stored in these Secrets:
  - {{params.admin_secret_name}}
  - {{params.reporting_secret_name}}

  Reporting dashboards are failing for {{params.reporting_username}} after a permissions change.
  Dashboards are built from {{params.app_database}}.{{params.reports_collection}}. {{params.app_database}}.{{params.raw_collection}} contains ingestion data and
  must not be exposed. Restore the minimum access needed for reporting dashboards.

  Notes:
  - Do not use operators or CRDs.

namespace_contract:
  required_roles:
    - mongodb

metrics:
  - time_to_first_mutation

preconditionUnits:
  - name: mongo_env_ready
    on_probe_fail: skip
    probe:
      # AUTHORITATIVE skip-if-running probe (P32): succeed when the canonical
      # StatefulSet exists OR any pod is Running, so the destructive namespace
      # rebuild below is skipped on an inherited cluster even if its pods are
      # momentarily not Running (mid-restart from a prior stage) -- the
      # StatefulSet persists across that window. The bare `grep -c Running`
      # could miss such a cluster and clobber inherited state.
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} get statefulset {{params.cluster_prefix}} >/dev/null 2>&1 || kubectl -n ${BENCH_NS_MONGODB} get pods 2>/dev/null | grep -q Running'"
        timeout_sec: 10
    apply:
      - command: |
          /bin/sh -c '
          kubectl delete namespace ${BENCH_NS_MONGODB} --ignore-not-found=true; kubectl wait --for=delete namespace/${BENCH_NS_MONGODB} --timeout=120s || true
          '
        sleep: 2
      - command: "kubectl create namespace ${BENCH_NS_MONGODB}"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/custom-roles/resource/secrets.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/custom-roles/resource/services.yaml"
        sleep: 1
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/custom-roles/resource/statefulset.yaml"
        sleep: 5
      - command: |
          for i in $(seq 1 120); do
            ready=$(kubectl -n ${BENCH_NS_MONGODB} get sts {{params.cluster_prefix}} -o jsonpath='{.status.readyReplicas}' 2>/dev/null)
            if [ "${ready:-0}" -ge 3 ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
        sleep: 2
      # Pod-Ready != mongod accepting TCP (§1.10): ping-until-ok before rs.initiate.
      - command: |
          for i in $(seq 1 30); do
            kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1 && exit 0
            sleep 3
          done
          exit 1
        sleep: 2
      - command: |
          kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet --eval '
          rs.initiate({_id:"{{params.replica_set_name}}",members:[
            {_id:0,host:"mongodb-replica-0.mongodb-replica-svc.'${BENCH_NS_MONGODB}'.svc.cluster.local:27017"},
            {_id:1,host:"mongodb-replica-1.mongodb-replica-svc.'${BENCH_NS_MONGODB}'.svc.cluster.local:27017"},
            {_id:2,host:"mongodb-replica-2.mongodb-replica-svc.'${BENCH_NS_MONGODB}'.svc.cluster.local:27017"}
          ]})'
        sleep: 5
      - command: |
          for i in $(seq 1 20); do
            kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep true && exit 0
            sleep 3
          done
          exit 1
        sleep: 2
      - command: |
          kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet --eval '
          db.getSiblingDB("admin").createUser({
            user: "{{params.admin_username}}",
            pwd: "admin123password",
            roles: [
              {role: "clusterAdmin", db: "admin"},
              {role: "userAdminAnyDatabase", db: "admin"},
              {role: "readWriteAnyDatabase", db: "admin"}
            ]
          })'
        sleep: 2
      - command: |
          kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet \
          "mongodb://{{params.admin_username}}:admin123password@localhost:27017/admin" \
          --eval 'db.getSiblingDB("{{params.app_database}}").createRole({
            role: "{{params.bad_role_name}}",
            privileges: [
              { resource: { db: "{{params.app_database}}", collection: "{{params.raw_collection}}" }, actions: ["find"] }
            ],
            roles: []
          })'
        sleep: 2
      - command: |
          kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet \
          "mongodb://{{params.admin_username}}:admin123password@localhost:27017/admin" \
          --eval 'db.getSiblingDB("admin").createUser({
            user: "{{params.reporting_username}}",
            pwd: "reporting123password",
            roles: [{role: "{{params.bad_role_name}}", db: "{{params.app_database}}"}]
          })'
        sleep: 2
      - command: |
          kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet \
          "mongodb://{{params.admin_username}}:admin123password@localhost:27017/admin" \
          --eval 'db.getSiblingDB("{{params.app_database}}").{{params.reports_collection}}.insertMany([{x:1},{x:2},{x:3}], {writeConcern:{w:1}})'
        sleep: 2
      - command: |
          kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet \
          "mongodb://{{params.admin_username}}:admin123password@localhost:27017/admin" \
          --eval 'db.getSiblingDB("{{params.app_database}}").{{params.raw_collection}}.insertMany([{x:10},{x:11}], {writeConcern:{w:1}})'
        sleep: 2
    verify:
      - command: "kubectl -n ${BENCH_NS_MONGODB} get pods 2>/dev/null | grep -c Running"
        timeout_sec: 10

  - name: admin_user_fixture
    # Composition self-sufficiency: this case authenticates as the `admin-user`
    # created at deploy. On an inherited cluster a no-auth/other predecessor may
    # not have created it, and a live user's password is unrecoverable -> the
    # oracle's (and the user fixtures') admin auth fails through no agent fault.
    # Bring our own additively: if admin-user already authenticates, skip; else
    # ensure the secret and create the user. No restart, no data touched,
    # idempotent -> never regresses a cluster where admin already works.
    on_probe_fail: skip
    probe:
      - command: |
          /bin/sh -c '
          t=""; for cca in /etc/tls/ca.crt /etc/mongo-ca/ca.crt; do kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- ls $cca >/dev/null 2>&1 && { t="--tls --tlsAllowInvalidHostnames --tlsAllowInvalidCertificates --tlsCAFile $cca"; break; }; done
          pw=$(kubectl -n ${BENCH_NS_MONGODB} get secret admin-user-password -o jsonpath="{.data.password}" 2>/dev/null | base64 -d 2>/dev/null)
          [ -n "$pw" ] || exit 1
          kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet $t "mongodb://{{params.admin_username}}:$pw@localhost:27017/admin" --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1
          '
        timeout_sec: 30
    apply:
      # Ensure the admin secret (idempotent: create only if missing).
      - command: "/bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} get secret admin-user-password >/dev/null 2>&1 || kubectl -n ${BENCH_NS_MONGODB} create secret generic admin-user-password --from-literal=password=admin123password'"
        sleep: 1
      # Ensure the admin-user MongoDB user. On a no-auth inherited cluster this
      # runs unauthenticated and succeeds; where it already exists it errors and
      # the `|| true` keeps it a no-op. Never drops or alters existing users/data.
      - command: |
          /bin/sh -c '
          t=""; for cca in /etc/tls/ca.crt /etc/mongo-ca/ca.crt; do kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- ls $cca >/dev/null 2>&1 && { t="--tls --tlsAllowInvalidHostnames --tlsAllowInvalidCertificates --tlsCAFile $cca"; break; }; done
          P=""; for _pi in $(seq 1 30); do P=$(kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet $t --eval "rs.hello().primary" 2>/dev/null | cut -d. -f1); [ -n "$P" ] && break; sleep 2; done; P=${P:-mongodb-replica-0}
          kubectl -n ${BENCH_NS_MONGODB} exec "$P" -- mongosh --quiet $t --eval "db.getSiblingDB(\"admin\").createUser({user:\"{{params.admin_username}}\",pwd:\"admin123password\",roles:[{role:\"root\",db:\"admin\"}]})" 2>/dev/null || true
          '
        sleep: 2
    verify:
      # P38: read the write back -- authenticate AS the admin user just created and
      # ping (bounded poll to tolerate election/replication lag), not merely assert
      # the companion secret exists.
      - command: |
          /bin/sh -c '
          t=""; for cca in /etc/tls/ca.crt /etc/mongo-ca/ca.crt; do kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- ls $cca >/dev/null 2>&1 && { t="--tls --tlsAllowInvalidHostnames --tlsAllowInvalidCertificates --tlsCAFile $cca"; break; }; done
          pw=$(kubectl -n ${BENCH_NS_MONGODB} get secret admin-user-password -o jsonpath="{.data.password}" 2>/dev/null | base64 -d 2>/dev/null); pw=${pw:-admin123password}
          for _vi in $(seq 1 20); do
            kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet $t "mongodb://{{params.admin_username}}:$pw@localhost:27017/admin?directConnection=true" --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1 && exit 0
            sleep 3
          done
          exit 1
          '
        timeout_sec: 90

  # Additive credential+role+seed fixture (composition safety): standalone the
  # build above creates the reporting-user, its rawRead role, the
  # reporting-user-password secret, and the reports/raw seed data. Chained on an
  # INHERITED cluster that build is skipped, so the oracle fails with
  # "reporting-user-password not found". Ensure each artifact additively when
  # missing, authenticating as the LIVE admin user (a prior rotation respected)
  # and writing on the current primary. Never drops/alters existing users/data;
  # standalone the probe finds everything present and skips -> identical behaviour.
  - name: reporting_user_fixture
    on_probe_fail: skip
    probe:
      - command: |
          /bin/sh -c 't=""; for cca in /etc/tls/ca.crt /etc/mongo-ca/ca.crt; do kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- ls $cca >/dev/null 2>&1 && { t="--tls --tlsAllowInvalidHostnames --tlsAllowInvalidCertificates --tlsCAFile $cca"; break; }; done; kubectl -n ${BENCH_NS_MONGODB} get secret {{params.reporting_secret_name}} >/dev/null 2>&1 || exit 1; pw=$(kubectl -n ${BENCH_NS_MONGODB} get secret {{params.admin_secret_name}} -o jsonpath="{.data.password}" 2>/dev/null | base64 -d 2>/dev/null); pw=${pw:-admin123password}; P=""; for _pi in $(seq 1 30); do P=$(kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet $t "mongodb://{{params.admin_username}}:$pw@localhost:27017/admin?directConnection=true" --eval '\''rs.hello().primary'\'' 2>/dev/null | cut -d. -f1); [ -n "$P" ] && break; sleep 2; done; P=${P:-mongodb-replica-0}; kubectl -n ${BENCH_NS_MONGODB} exec "$P" -- mongosh --quiet $t "mongodb://{{params.admin_username}}:$pw@localhost:27017/admin" --eval '\''db.getSiblingDB("admin").getUser("{{params.reporting_username}}")?quit(0):quit(1)'\'' >/dev/null 2>&1'
        timeout_sec: 30
    apply:
      - command: "kubectl -n ${BENCH_NS_MONGODB} apply -f cases/tests/mongodb/custom-roles/resource/secrets.yaml"
        sleep: 1
      - command: |
          /bin/sh -c 'pw=$(kubectl -n ${BENCH_NS_MONGODB} get secret {{params.admin_secret_name}} -o jsonpath="{.data.password}" 2>/dev/null | base64 -d 2>/dev/null); pw=${pw:-admin123password}; P=""; for _pi in $(seq 1 30); do P=$(kubectl -n ${BENCH_NS_MONGODB} exec mongodb-replica-0 -- mongosh --quiet "mongodb://{{params.admin_username}}:$pw@localhost:27017/admin?directConnection=true" --eval '\''rs.hello().primary'\'' 2>/dev/null | cut -d. -f1); [ -n "$P" ] && break; sleep 2; done; P=${P:-mongodb-replica-0}; kubectl -n ${BENCH_NS_MONGODB} exec "$P" -- mongosh --quiet "mongodb://{{params.admin_username}}:$pw@localhost:27017/admin" --eval '\''var a=db.getSiblingDB("{{params.app_database}}"); if(!a.getRole("{{params.bad_role_name}}")){a.createRole({role:"{{params.bad_role_name}}",privileges:[{resource:{db:"{{params.app_database}}",collection:"{{params.raw_collection}}"},actions:["find"]}],roles:[]});} if(!db.getSiblingDB("admin").getUser("{{params.reporting_username}}")){db.getSiblingDB("admin").createUser({user:"{{params.reporting_username}}",pwd:"reporting123password",roles:[{role:"{{params.bad_role_name}}",db:"{{params.app_database}}"}]});} if(a.{{params.reports_collection}}.countDocuments({})<3){a.{{params.reports_collection}}.insertMany([{x:1},{x:2},{x:3}],{writeConcern:{w:1}});} if(a.{{params.raw_collection}}.countDocuments({})<2){a.{{params.raw_collection}}.insertMany([{x:10},{x:11}],{writeConcern:{w:1}});}'\'' 2>&1 || true'
        sleep: 2
    verify:
      - command: |
          /bin/sh -c 'kubectl -n ${BENCH_NS_MONGODB} get secret {{params.reporting_secret_name}} >/dev/null 2>&1; true'
        timeout_sec: 30

oracle:
  verify:
    commands:
      - command: "python3 cases/tests/mongodb/custom-roles/oracle/oracle.py"
        timeout_sec: 150
