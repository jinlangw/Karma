apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: crdb
  namespace: ${BENCH_PARAM_MONITORING_NAMESPACE}
  labels:
    app: prometheus
spec:
  replicas: 1
  serviceAccountName: prometheus
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ${BENCH_NAMESPACE}
  podMonitorSelector: {}
  podMonitorNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ${BENCH_NAMESPACE}
  scrapeInterval: 30s
  scrapeTimeout: 10s
  evaluationInterval: 30s
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ${BENCH_PARAM_MONITORING_NAMESPACE}
spec:
  ports:
  - name: web
    port: 9090
    targetPort: web
  selector:
    prometheus: crdb
