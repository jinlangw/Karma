apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: ${BENCH_PARAM_MONITORING_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${BENCH_MONITORING_RBAC_PREFIX}-prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - services
  - endpoints
  - pods
  - configmaps
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${BENCH_MONITORING_RBAC_PREFIX}-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${BENCH_MONITORING_RBAC_PREFIX}-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: ${BENCH_PARAM_MONITORING_NAMESPACE}
