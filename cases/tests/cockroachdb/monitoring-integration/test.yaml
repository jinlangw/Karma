# cockroachdb/monitoring-integration
# Integrate the selected cluster's existing metrics endpoint with Prometheus.
prompt: |
  Enable Prometheus scraping for CockroachDB cluster {{params.cluster_name}}
  in namespace ${BENCH_NAMESPACE}, using {{params.metrics_path}} on port {{params.metrics_port}}.
  Prometheus resource crdb and Service prometheus are running in the monitoring
  namespace: use {{params.monitoring_namespace}} if nonempty, otherwise ${BENCH_NS_MONITORING}.
  You may use any Prometheus Operator-compatible approach. Inspect the existing
  Prometheus selectors and the database's HTTP/HTTPS mode. Preserve its security
  mode, data, version, topology and certificates, and unrelated monitoring targets.

  Previous scraping for this selected database was removed or selectively excluded
  from shared configuration. Configure a dedicated integration for this cluster.
  A helper pod {{params.cluster_name}}-monitoring-curl is available in the database namespace.

  Verification:
  1. Prometheus has an up target for the selected CockroachDB metrics endpoint.
  2. The metrics endpoint returns actual CockroachDB metrics inside the cluster.
params:
  cluster_name:
    default: crdb-cluster
    description: Selected CockroachDB StatefulSet and related resource prefix
  monitoring_namespace:
    default: ''
    description: Existing monitoring namespace; empty uses Karma's monitoring namespace role
  metrics_path:
    default: /_status/vars
    description: HTTP path exposing CockroachDB Prometheus metrics
  metrics_port:
    default: 8080
    description: Port on which the CockroachDB metrics endpoint is served
namespace_contract:
  required_roles: [default, monitoring]
metrics:
  - time_to_first_mutation
preconditionUnits:
  - name: crdb_env_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py environment probe"
        timeout_sec: 180
    apply:
      - command: "python3 -u cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py environment apply"
        timeout_sec: 1800
    verify:
      - command: "python3 cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py environment verify"
        timeout_sec: 180
  - name: crdb_monitoring_stack_ready
    on_probe_fail: skip
    probe:
      - command: "python3 cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py stack probe"
        timeout_sec: 180
    apply:
      - command: "python3 -u cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py stack apply"
        timeout_sec: 900
    verify:
      - command: "python3 cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py stack verify"
        timeout_sec: 180
  - name: crdb_scraping_absent
    on_probe_fail: skip
    probe:
      - command: "python3 cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py scraping probe"
        timeout_sec: 180
    apply:
      - command: "python3 -u cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py scraping apply"
        timeout_sec: 600
    verify:
      - command: "python3 cases/tests/cockroachdb/monitoring-integration/scripts/prepare.py scraping verify"
        timeout_sec: 180
oracle:
  verify:
    commands:
      - command: "python3 cases/tests/cockroachdb/monitoring-integration/oracle/oracle.py"
        timeout_sec: 420
