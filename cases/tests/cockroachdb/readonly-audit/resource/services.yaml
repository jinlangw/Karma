apiVersion: v1
kind: Service
metadata:
  name: ${BENCH_PARAM_CLUSTER_NAME}
  namespace: ${BENCH_NAMESPACE}
  labels:
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: ${BENCH_PARAM_CLUSTER_NAME}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: ${BENCH_PARAM_CLUSTER_NAME}
---
apiVersion: v1
kind: Service
metadata:
  name: ${BENCH_PARAM_CLUSTER_NAME}-public
  namespace: ${BENCH_NAMESPACE}
  labels:
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: ${BENCH_PARAM_CLUSTER_NAME}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: ${BENCH_PARAM_CLUSTER_NAME}
