# Read-only audit of the inherited selected cluster; configuration must remain unchanged.
prompt: |
  Audit CockroachDB StatefulSet {{params.cluster_name}} in namespace ${BENCH_NAMESPACE}.
  Inspect its CURRENT configuration and produce an accurate report without changing
  database settings, zones, workload configuration, storage, or TLS material.
  Use the existing SQL connection mode and mounted client certificates when TLS is enabled.

  Create a ConfigMap with key findings.json containing this JSON structure:
    {
      "schema_version": 1,
      "identity": {
        "namespace": "${BENCH_NAMESPACE}", "cluster_name": "{{params.cluster_name}}",
        "run_id": "${BENCH_RUN_ID}", "stage_id": "${BENCH_STAGE_ID}",
        "cluster_id": "<SELECT crdb_internal.cluster_id()>"
      },
      "settings": {"<variable>": "<value>", "...": "..."},
      "zones": [{"target": "<target>", "raw_config_sql": "<raw_config_sql>"}],
      "replicas": <StatefulSet spec.replicas integer>,
      "nodes": [{"pod": "<pod name>", "node_id": "<node ID string>", "version": "<SELECT version()>"}],
      "healthy": true,
      "tls": <true if TLS enabled, otherwise false>
    }

  Required settings are every variable returned by:
    SELECT variable, value FROM crdb_internal.cluster_settings ORDER BY variable;
  Include every row from SHOW ZONE CONFIGURATIONS, with its exact target and raw_config_sql.
  These zone SQL definitions include replication factors and GC TTL configuration.
  Sort zones by target and nodes by pod name. Query each selected node for its ID
  and version. Check all selected nodes are healthy using SQL and node status.
  Extra narrative can be stored under a separate ConfigMap key, not inside findings.json.

  Compute this stage's report name and label value:
    audit_id=$(printf '%s' "${BENCH_NAMESPACE}/{{params.cluster_name}}/${BENCH_RUN_ID}/${BENCH_STAGE_ID}" | shasum -a 256 | cut -c1-20)
    report_name="crdb-audit-${audit_id}"
  Create the report ConfigMap in ${BENCH_NAMESPACE} with labels:
    app.kubernetes.io/name: cockroachdb
    app.kubernetes.io/instance: {{params.cluster_name}}
    karma.dev/fixture: readonly-audit
    karma.dev/audit-id: <audit_id>

  The framework's encrypted baseline is not an audit report. Preserve it and all
  earlier audit artifacts. Submit actual readable facts obtained from the live cluster.
  The only permitted cluster mutation is creating this stage's report ConfigMap.

params:
  cluster_name:
    default: crdb-cluster
    description: CockroachDB StatefulSet name identifying the target cluster

namespace_contract:
  required_roles: [default]

metrics:
  - time_to_first_mutation

preconditionUnits:
  - name: crdb_env_ready
    on_probe_fail: skip
    probe:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py environment probe
        timeout_sec: 180
    apply:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py environment apply
        timeout_sec: 1200
    verify:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py environment verify
        timeout_sec: 180

  - name: crdb_audit_report_absent
    on_probe_fail: skip
    probe:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py report probe
        timeout_sec: 30
    apply:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py report apply
        timeout_sec: 30
    verify:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py report verify
        timeout_sec: 30

  - name: crdb_audit_baseline_ready
    on_probe_fail: skip
    probe:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py baseline probe
        trusted_stdin: stage_key
        timeout_sec: 60
    apply:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py baseline apply
        trusted_stdin: stage_key
        timeout_sec: 240
    verify:
      - command: python3 cases/tests/cockroachdb/readonly-audit/scripts/prepare.py baseline verify
        trusted_stdin: stage_key
        timeout_sec: 60

oracle:
  verify:
    commands:
      - command: python3 cases/tests/cockroachdb/readonly-audit/oracle/oracle.py
        trusted_stdin: stage_key
        timeout_sec: 300
